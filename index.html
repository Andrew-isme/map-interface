<!DOCTYPE html>
<html>
<head>
  <title>Full Geoapify Map App</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    .autocomplete-input {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 300px;
    }
    .info-box {
      background: white;
      padding: 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
<input class="autocomplete-input" id="autocomplete" placeholder="Search a place..." />
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.min.js"></script>
<script src="https://unpkg.com/@geoapify/leaflet-routing-machine@1.2.0/dist/geoapify-routing-machine.min.js"></script>

<script>
const apiKey = "6e4d6234b8f64dbeb61c01a4b39b6879
GET
API URL example
https://api.geoapify.com/v1/routing?waypoints=50.96209827745463%2C4.414458883409225%7C50.429137079078345%2C5.00088081232559&mode=drive&apiKey=6e4d6234b8f64dbeb61c01a4b39b6879

const map = L.map('map').setView([20.5937, 78.9629], 5);

// Base map tiles
L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-carto/{z}/{x}/{y}.png?apiKey=${apiKey}`, {
  attribution: '© OpenStreetMap contributors, © Geoapify',
  maxZoom: 20
}).addTo(map);

// Routing Example (Delhi to Mumbai)
L.Routing.control({
  waypoints: [
    L.latLng(28.6139, 77.2090),
    L.latLng(19.0760, 72.8777)
  ],
  router: L.Routing.geoapify({ apiKey }),
  routeWhileDragging: true
}).addTo(map);

// Autocomplete Search
const input = document.getElementById("autocomplete");
input.addEventListener("input", async () => {
  const query = input.value;
  if (!query) return;
  const response = await fetch(`https://api.geoapify.com/v1/geocode/autocomplete?text=${encodeURIComponent(query)}&apiKey=${apiKey}`);
  const data = await response.json();
  if (data.features.length > 0) {
    const result = data.features[0];
    const [lon, lat] = result.geometry.coordinates;
    map.setView([lat, lon], 14);
    L.marker([lat, lon]).addTo(map).bindPopup(result.properties.formatted).openPopup();
  }
});

// Isochrone Example: reachable area in 10 mins walk from India Gate
fetch(`https://api.geoapify.com/v1/isochrone?lat=28.6129&lon=77.2295&type=walk&mode=fast&range=600&apiKey=${apiKey}`)
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: { color: "blue", opacity: 0.4 }
    }).addTo(map).bindPopup("10 min walk from India Gate");
  });

// Places API Example: nearby cafes near India Gate
fetch(`https://api.geoapify.com/v2/places?categories=catering.cafe&filter=circle:77.2295,28.6129,1000&limit=5&apiKey=${apiKey}`)
  .then(res => res.json())
  .then(data => {
    data.features.forEach(place => {
      const [lon, lat] = place.geometry.coordinates;
      L.marker([lat, lon]).addTo(map).bindPopup(place.properties.name || "Cafe");
    });
  });

// Elevation API Example: get elevation of a point
fetch(`https://api.geoapify.com/v1/elevation?lat=28.6129&lon=77.2295&apiKey=${apiKey}`)
  .then(res => res.json())
  .then(data => {
    const elevation = data.elevation;
    L.popup()
      .setLatLng([28.6129, 77.2295])
      .setContent(`<div class='info-box'>Elevation: ${elevation.toFixed(2)} meters</div>`)
      .openOn(map);
  });
</script>
</body>
</html>
