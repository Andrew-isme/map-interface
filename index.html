<!DOCTYPE html>
<html>
<head>
  <title>Full Geoapify Map App</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    .autocomplete-input {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 300px;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .info-box {
      background: white;
      padding: 5px;
      border-radius: 5px;
    }
    .suggestions {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      max-height: 150px;
      overflow-y: auto;
      width: 300px;
      z-index: 1001;
      display: none;
      box-sizing: border-box;
    }
    .suggestions div {
      padding: 5px;
      cursor: pointer;
    }
    .suggestions div:hover {
      background: #f0f4f4;
    }
  </style>
</head>
<body>
<div style="position: relative; text-align: center;">
  <input class="autocomplete-input" id="autocomplete" placeholder="Search a place..." />
  <div id="suggestions" class="suggestions"></div>
</div>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.min.js"></script>
<script src="https://unpkg.com/@geoapify/leaflet-routing-machine@1.2.0/dist/geoapify-routing-machine.min.js"></script>

<script>
const apiKey = "6e4d6234b8f64dbeb61c01a4b39b6879"; // Note: Exposed API key (consider proxying in production)

const map = L.map('map').setView([20.5937, 78.9629], 5);

// Base map tiles
L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-carto/{z}/{x}/{y}.png?apiKey=${apiKey}`, {
  attribution: '© OpenStreetMap contributors, © Geoapify',
  maxZoom: 20
}).addTo(map);

let userLocation = null;
let routingControl = null;
let searchedMarker = null;
let currentPopup = null;

// User location detection
map.locate({ setView: true, maxZoom: 12 });
map.on('locationfound', (e) => {
  userLocation = e.latlng;
  L.marker(userLocation).addTo(map).bindPopup("📍 You are here").openPopup();
});
map.on('locationerror', () => {
  alert("Location access denied or unavailable.");
});

// Debounce function to limit API calls
function debounce(func, wait) {
  let timeout;
  return function(...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}

// Function to show suggestions
function showSuggestions(results, callback) {
  const suggestionsDiv = document.getElementById('suggestions');
  suggestionsDiv.innerHTML = '';
  suggestionsDiv.style.display = results.length > 0 ? 'block' : 'none';

  results.forEach(result => {
    const suggestion = document.createElement('div');
    suggestion.textContent = result.properties.formatted;
    suggestion.onclick = function() {
      callback(result);
      suggestionsDiv.style.display = 'none';
      document.getElementById('autocomplete').value = result.properties.formatted;
    };
    suggestionsDiv.appendChild(suggestion);
  });
}

// Autocomplete Search with Debouncing
const input = document.getElementById("autocomplete");
input.addEventListener("input", debounce(async () => {
  const query = input.value.trim();
  if (!query) {
    document.getElementById('suggestions').style.display = 'none';
    return;
  }

  try {
    const response = await fetch(`https://api.geoapify.com/v1/geocode/autocomplete?text=${encodeURIComponent(query)}&apiKey=${apiKey}`);
    if (!response.ok) throw new Error("Autocomplete API request failed");
    const data = await response.json();

    if (data.features.length > 0) {
      showSuggestions(data.features, async (result) => {
        const [lon, lat] = result.geometry.coordinates;
        map.setView([lat, lon], 14);
        if (searchedMarker) map.removeLayer(searchedMarker);
        searchedMarker = L.marker([lat, lon]).addTo(map).bindPopup(result.properties.formatted).openPopup();

        // Dynamic Isochrone: reachable area in 10 mins walk from searched location
        try {
          const isochroneRes = await fetch(`https://api.geoapify.com/v1/isochrone?lat=${lat}&lon=${lon}&type=walk&mode=fast&range=600&apiKey=${apiKey}`);
          if (!isochroneRes.ok) throw new Error("Isochrone API request failed");
          const isochroneData = await isochroneRes.json();
          L.geoJSON(isochroneData, {
            style: { color: "blue", opacity: 0.4 }
          }).addTo(map).bindPopup(`10 min walk from ${result.properties.formatted}`);
        } catch (error) {
          console.error("Isochrone Error:", error.message);
        }

        // Dynamic Places API: nearby cafes near searched location
        try {
          const placesRes = await fetch(`https://api.geoapify.com/v2/places?categories=catering.cafe&filter=circle:${lon},${lat},1000&limit=5&apiKey=${apiKey}`);
          if (!placesRes.ok) throw new Error("Places API request failed");
          const placesData = await placesRes.json();
          placesData.features.forEach(place => {
            const [placeLon, placeLat] = place.geometry.coordinates;
            L.marker([placeLat, placeLon]).addTo(map).bindPopup(place.properties.name || "Cafe");
          });
        } catch (error) {
          console.error("Places Error:", error.message);
        }

        // Dynamic Elevation API: get elevation of searched location
        try {
          const elevationRes = await fetch(`https://api.geoapify.com/v1/elevation?lat=${lat}&lon=${lon}&apiKey=${apiKey}`);
          if (!elevationRes.ok) throw new Error("Elevation API request failed");
          const elevationData = await elevationRes.json();
          const elevation = elevationData.elevation;
          L.popup()
            .setLatLng([lat, lon])
            .setContent(`<div class='info-box'>Elevation: ${elevation.toFixed(2)} meters</div>`)
            .openOn(map);
        } catch (error) {
          console.error("Elevation Error:", error.message);
        }

        // Live routing from user location to searched place
        if (userLocation) {
          if (routingControl) {
            map.removeControl(routingControl);
            routingControl = null;
          }
          routingControl = L.Routing.control({
            waypoints: [
              L.latLng(userLocation.lat, userLocation.lng),
              L.latLng(lat, lon)
            ],
            router: L.Routing.geoapify({ apiKey }),
            routeWhileDragging: false
          }).addTo(map);
        } else {
          alert("User location not found. Please ensure location access is enabled.");
        }
      });
    } else {
      document.getElementById('suggestions').style.display = 'none';
    }
  } catch (error) {
    console.error("Autocomplete Error:", error.message);
    alert("Failed to search for the place. Please try again.");
  }
}, 500));

// Handle Enter key to select first suggestion
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const suggestions = document.getElementById('suggestions');
    if (suggestions.style.display === 'block' && suggestions.firstChild) {
      suggestions.firstChild.click();
    }
  }
});

// Hide suggestions when clicking outside
document.addEventListener('click', function(e) {
  if (!e.target.closest('.autocomplete-input') && !e.target.closest('.suggestions')) {
    document.getElementById('suggestions').style.display = 'none';
  }
});

// Reverse Geocoding on map click
map.on('click', async (e) => {
  const { lat, lng } = e.latlng;
  try {
    const res = await fetch(`https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lng}&apiKey=${apiKey}`);
    if (!res.ok) throw new Error("Reverse Geocoding API request failed");
    const data = await res.json();
    if (data.features.length > 0) {
      const address = data.features[0].properties.formatted;
      if (currentPopup) map.closePopup(currentPopup);
      currentPopup = L.popup().setLatLng([lat, lng]).setContent(`📍 ${address}`).openOn(map);
    }
  } catch (error) {
    console.error("Reverse Geocoding Error:", error.message);
    alert("Failed to get address for this location.");
  }
});
</script>
</body>
</html>
